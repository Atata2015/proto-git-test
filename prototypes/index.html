<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Прототипы</title>
<!--
  Общий шаблон страниц каталога и фичи. Один файл для обеих страниц.
  Публикующий скилл (Claude, ChatGPT или любой другой) ничего здесь не меняет, кроме одного:
  заменяет единственную метку данных внутри <script id="prototypes-data"> ниже на JSON с данными страницы (формат — в документации,
  раздел «Формат данных»), заменив в JSON каждое "</" на "<\/". Вся вёрстка и логика — здесь.
  Шаблон-версия: 1
-->
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e3e2dd;--accent:#3355ff;--chip:#eef0ff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#f0efe9;--muted:#a3a29b;--line:#2f2f2c;--accent:#8ea2ff;--chip:#262a40;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:28px 18px 48px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:8px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}.lead{color:var(--muted);margin:0 0 24px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 12px}
.card h2{font-size:18px;margin:0 0 4px}.meta{font-size:13px;color:var(--muted)}
.desc{margin:6px 0 0}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-block;padding:8px 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px}
@media (prefers-color-scheme:dark){.btn{color:#111}}
.ghost{display:inline-block;padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px}
.frozen{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.frozen h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-block;background:var(--chip);border-radius:8px;padding:4px 10px;margin:0 6px 6px 0;font-size:14px}
.empty{color:var(--muted)}footer{margin-top:32px;font-size:12px;color:var(--muted)}
.noscript{color:var(--muted)}
</style>
</head>
<body>
<main id="app"><noscript><p class="noscript">Для просмотра страницы включите JavaScript.</p></noscript></main>
<script id="prototypes-data" type="application/json">{"schema":1,"page":"catalog","catalog_title":"Прототипы (тест)","link_style":"dir","generated_at":"2026-10-30T15:12:16.484+00:00","features":[{"slug":"pipeline-test","title":"Тест пайплайна","created_at":"2026-10-30T08:43:28.867+00:00","updated_at":"2026-10-30T09:40:04.330+00:00","prototypes":[{"slug":"section-1","title":"Section 1","version":3,"created_at":"2026-10-30T08:43:28.867+00:00","updated_at":"2026-10-30T09:40:04.330+00:00","frozen":[{"id":"2026-10-30-yuzertest-1","label":"Юзертест 1","version":2,"frozen_at":"2026-10-30T09:39:56.481+00:00"}]}]},{"slug":"test-prototype","title":"Test-prototype_2","created_at":"2026-10-30T10:31:23.514+00:00","updated_at":"2026-10-30T10:31:23.514+00:00","prototypes":[{"slug":"main","title":"Test-prototype_2","version":1,"figma_url":"https://www.figma.com/design/5xwdEKxqLM6H9DbqfvGwu3/-SYSTEM--UI-Kit--Test-?node-id=4158-22","created_at":"2026-10-30T10:31:23.514+00:00","updated_at":"2026-10-30T10:31:23.514+00:00","frozen":[]}]},{"slug":"test-prototype-3","title":"Test-prototype-3","created_at":"2026-10-30T14:27:08.928+00:00","updated_at":"2026-10-30T14:27:08.928+00:00","prototypes":[{"slug":"test-prototype-3","title":"Test-prototype-3","version":1,"figma_url":"https://www.figma.com/design/5xwdEKxqLM6H9DbqfvGwu3/?node-id=4158-22","created_at":"2026-10-30T14:27:08.928+00:00","updated_at":"2026-10-30T14:27:08.928+00:00","frozen":[]}]}]}</script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var data;
  try { data = JSON.parse(document.getElementById("prototypes-data").textContent); }
  catch (e) { app.textContent = "Не удалось прочитать данные страницы."; return; }

  var FROZEN = "_frozen";
  var fileLinks = data.link_style === "file";
  function href(path) { path = path.replace(/\/+$/, ""); return path + (fileLinks ? "/index.html" : "/"); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function has(v) { return v !== null && v !== undefined && v !== ""; }
  function fmtDate(iso) {
    if (!has(iso)) return "";
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
    return m ? m[3] + "." + m[2] + "." + m[1] : String(iso);
  }
  function plural(n, one, few, many) {
    if (n % 10 === 1 && n % 100 !== 11) return one;
    if (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) return few;
    return many;
  }
  function orderOf(p) { var o = parseInt(p.order, 10); return isNaN(o) ? 999 : o; }
  function byProto(a, b) {
    return (orderOf(a) - orderOf(b)) ||
      String(a.created_at || "").localeCompare(String(b.created_at || "")) ||
      String(a.slug).localeCompare(String(b.slug));
  }
  function lastUpdate(f) {
    var u = String(f.updated_at || "");
    (f.prototypes || []).forEach(function (p) { if (String(p.updated_at || "") > u) u = String(p.updated_at); });
    return u;
  }
  function footer() {
    app.appendChild(el("footer", null, "Страница создаётся автоматически при публикации прототипа. Ручные правки будут перезаписаны."));
  }
  var catalogTitle = has(data.catalog_title) ? data.catalog_title : "Прототипы";
  var features = (data.features || []).slice();

  function renderCatalog() {
    document.title = catalogTitle;
    app.appendChild(el("h1", null, catalogTitle));
    app.appendChild(el("p", "lead", "Все опубликованные прототипы по фичам."));
    features.sort(function (a, b) { return lastUpdate(b).localeCompare(lastUpdate(a)) || String(a.slug).localeCompare(String(b.slug)); });
    if (!features.length) { app.appendChild(el("p", "empty", "Пока ничего не опубликовано.")); }
    features.forEach(function (f) {
      var n = (f.prototypes || []).length;
      var card = el("a", "card"); card.href = href(f.slug);
      card.appendChild(el("h2", null, has(f.title) ? f.title : f.slug));
      var upd = lastUpdate(f);
      card.appendChild(el("div", "meta", n + " " + plural(n, "прототип", "прототипа", "прототипов") + (upd ? " · обновлено " + fmtDate(upd) : "")));
      if (has(f.description)) card.appendChild(el("p", "desc", f.description));
      app.appendChild(card);
    });
    footer();
  }

  function renderFeature(f) {
    var title = has(f.title) ? f.title : f.slug;
    document.title = title;
    var crumbs = el("div", "crumbs"); var up = el("a", null, catalogTitle);
    up.href = fileLinks ? "../index.html" : "../"; crumbs.appendChild(up); app.appendChild(crumbs);
    app.appendChild(el("h1", null, title));
    app.appendChild(el("p", "lead", has(f.description) ? f.description : "Прототипы фичи"));
    (f.prototypes || []).slice().sort(byProto).forEach(function (p) {
      var card = el("div", "card");
      card.appendChild(el("h2", null, has(p.title) ? p.title : p.slug));
      card.appendChild(el("div", "meta", "v" + (has(p.version) ? p.version : 1) + (has(p.updated_at) ? " · обновлено " + fmtDate(p.updated_at) : "")));
      if (has(p.description)) card.appendChild(el("p", "desc", p.description));
      var row = el("div", "row");
      var open = el("a", "btn", "Открыть"); open.href = href(p.slug); row.appendChild(open);
      if (has(p.figma_url)) {
        var fg = el("a", "ghost", "Макет в Figma"); fg.href = p.figma_url; fg.target = "_blank"; fg.rel = "noopener"; row.appendChild(fg);
      }
      card.appendChild(row);
      var frozen = (p.frozen || []).slice().sort(function (a, b) { return String(b.id).localeCompare(String(a.id)); });
      if (frozen.length) {
        var box = el("div", "frozen"); box.appendChild(el("h3", null, "Зафиксированные для теста"));
        frozen.forEach(function (z) {
          var label = has(z.label) ? z.label : (fmtDate(z.frozen_at) || z.id);
          var chip = el("a", "chip", label + (has(z.version) ? " · v" + z.version : ""));
          chip.href = href(p.slug + "/" + FROZEN + "/" + z.id);
          box.appendChild(chip);
        });
        card.appendChild(box);
      }
      app.appendChild(card);
    });
    footer();
  }

  if (data.page === "feature") {
    var f = features.filter(function (x) { return x.slug === data.feature; })[0];
    if (f) renderFeature(f); else app.textContent = "Фича не найдена в данных страницы.";
  } else {
    renderCatalog();
  }
})();
</script>
</body>
</html>
