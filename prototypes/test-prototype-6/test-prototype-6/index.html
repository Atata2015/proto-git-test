<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Test-prototype-6</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#e8e8ea;--muted:#8a8f99;--accent:#f5d33a}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
/* без отступов под вырез/индикатор: сцена занимает всю доступную область, иначе на iPhone боковые safe-area сжимают её по ширине и появляются рамки сверху и снизу */
#viewport{position:fixed;inset:0;padding:0;display:flex;align-items:center;justify-content:center}
#fit{position:relative;flex:none;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.bg,.layer{position:absolute;pointer-events:none;display:block}
.bg{left:0;top:0;width:100%;height:100%}
.hit{position:absolute;cursor:pointer;border-radius:12px}
.hit.press:active{background:rgba(0,0,0,.18)}
.hit.over{z-index:3}
.scroll{position:absolute;overflow:hidden}
.scroll.x{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll.y{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll.both{overflow:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>.content{position:relative}
.scrim{position:absolute;inset:0;display:none;z-index:40}
.screen.anim{z-index:5}
.pane{position:absolute;inset:0;pointer-events:none}
.pane .hit,.pane .scroll{pointer-events:auto}
.scrim.on{display:block}
.effect{position:absolute;visibility:hidden;pointer-events:none;z-index:50;will-change:transform,opacity}
.effect.show{visibility:visible}
#fs{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.82);z-index:90;text-align:center;padding:24px}
#fs.on{display:flex}
#fs button{font:600 17px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border:0;border-radius:14px;padding:16px 28px;cursor:pointer}
#fs .main{background:var(--accent);color:#1a1a1a;min-width:260px}
#fs .alt{background:transparent;color:var(--muted);padding:8px 16px;font-weight:500;font-size:15px}
#fs p{margin:0;color:var(--muted);font-size:13px;max-width:34ch;line-height:1.45;min-height:1em}
#fs button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);color:var(--fg);text-align:center;padding:32px;z-index:100}
#rotate svg{width:72px;height:72px}
#rotate p{margin:0;font-size:17px;line-height:1.45;max-width:26ch}
#rotate small{color:var(--muted);font-size:13px}
@media (pointer:coarse) and (orientation:portrait){html.want-landscape #rotate{display:flex}}
@media (pointer:coarse) and (orientation:landscape){html.want-portrait #rotate{display:flex}}
</style>
</head>
<body>
<div id="viewport"><div id="fit"><div id="stage"></div></div></div>
<div id="fs" role="dialog" aria-label="Полноэкранный режим">
  <button class="main" id="fsGo">Открыть на весь экран</button>
  <button class="alt" id="fsSkip">Продолжить в окне браузера</button>
  <p id="fsMsg"></p>
</div>
<div id="rotate" role="status">
  <svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

  <small>Состояние прототипа сохраняется до перезагрузки страницы.</small>
</div>

/* ===== Сцена и масштаб ===== */
const W = SPEC.stage.w, H = SPEC.stage.h;
const stage = document.getElementById('stage'), fit = document.getElementById('fit');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
stage.style.background = SPEC.stage.background || '#000';
document.body.style.background = SPEC.stage.letterbox || '#000';
const landscape = W >= H;
document.documentElement.classList.add(landscape ? 'want-landscape' : 'want-portrait');
document.getElementById('rotateText').textContent = landscape
  ? 'Поверните телефон горизонтально — прототип сделан под экран ' + W + '×' + H + '.'
  : 'Поверните телефон вертикально — прототип сделан под экран ' + W + '×' + H + '.';
const viewportEl = document.getElementById('viewport');
let SCALE = 1;
function layout(){
  const cs = getComputedStyle(viewportEl);
  const aw = viewportEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = viewportEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  SCALE = Math.min(aw / W, ah / H);
  fit.style.width = (W * SCALE) + 'px'; fit.style.height = (H * SCALE) + 'px';
  stage.style.transform = 'scale(' + SCALE + ')';
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 150));
layout();

/* ===== Состояние ===== */
const state = {};
for (const [k, v] of Object.entries(SPEC.state || {})) state[k] = v.initial;
function derivedValue(name){
  for (const rule of SPEC.derived[name].rules) if (!rule.when || match(rule.when)) return rule.value;
  return undefined;
}
function val(name){
  if (name in state) return state[name];
  if (SPEC.derived && name in SPEC.derived) return derivedValue(name);
  return undefined;
}
const OPS = {eq: (a, b) => a == b, ne: (a, b) => a != b, gt: (a, b) => +a > +b, gte: (a, b) => +a >= +b, lt: (a, b) => +a < +b, lte: (a, b) => +a <= +b};
function test(v, x){
  if (x !== null && typeof x === 'object' && !Array.isArray(x))
    return Object.entries(x).every(([op, b]) => OPS[op] ? OPS[op](v, b) : false);
  return (Array.isArray(x) ? x : [x]).some(e => e == v);
}
function match(cond){
  return Object.entries(cond).every(([k, x]) => test(val(k), x));
}
function tpl(s){ return String(s).replace(/\{([^}]+)\}/g, (m, k) => val(k)); }
function px(el, r){
  el.style.left = r.x + 'px'; el.style.top = r.y + 'px';
  if (r.w != null) el.style.width = r.w + 'px';
  if (r.h != null) el.style.height = r.h + 'px';
}

/* ===== Построение DOM из spec ===== */
const screens = {}, layers = [], hits = [], overlays = {}, effects = {};
function buildLayer(parent, L){
  const img = document.createElement('img');
  img.className = 'layer'; img.alt = '';
  px(img, {x: L.x, y: L.y, w: L.w, h: L.h});
  parent.appendChild(img);
  layers.push({el: img, L});
}
function buildHit(parent, screenId, scope, h){
  const d = document.createElement('div');
  d.className = 'hit' + (h.press ? ' press' : '') + (h.overScroll ? ' over' : '');
  const pad = h.pad || 0;
  px(d, {x: h.x - pad, y: h.y - pad, w: h.w + 2 * pad, h: h.h + 2 * pad});
  if (h.round) d.style.borderRadius = '50%';
  d.dataset.hs = screenId + '/' + (scope ? scope + '/' : '') + h.id;
  d.addEventListener('click', e => { e.stopPropagation(); run(h.on || [], {el: d, h}); });
  parent.appendChild(d);
  hits.push({el: d, h});
}
/* Порядок: слои → зоны → прокрутки. Прокрутка лежит над зонами своего уровня, поэтому большая зона
   (например, «тап по всему экрану») не блокирует скролл. Кнопка, которая плавает над прокруткой, — overScroll: true. */
function buildChildren(parent, screenId, scope, node){
  (node.layers || []).forEach(L => buildLayer(parent, L));
  (node.hotspots || []).forEach(h => buildHit(parent, screenId, scope, h));
  (node.scrolls || []).forEach(S => {
    const box = document.createElement('div');
    box.className = 'scroll ' + (S.axis || 'x');
    box.dataset.sc = screenId + '/' + (scope ? scope + '/' : '') + S.id;
    px(box, S);
    const content = document.createElement('div');
    content.className = 'content';
    content.style.width = (S.contentW || S.w) + 'px'; content.style.height = (S.contentH || S.h) + 'px';
    box.appendChild(content); parent.appendChild(box);
    buildChildren(content, screenId, (scope ? scope + '/' : '') + S.id, S);
  });
}
for (const [sid, S] of Object.entries(SPEC.screens)){
  const sec = document.createElement('section');
  sec.className = 'screen'; sec.id = 'scr-' + sid;
  if (S.bg){ const bg = document.createElement('img'); bg.className = 'bg'; bg.alt = ''; bg.src = A[S.bg]; sec.appendChild(bg); }
  buildChildren(sec, sid, '', S);
  for (const [oid, O] of Object.entries(S.overlays || {})){
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    if (O.dim) scrim.style.background = O.dim;
    scrim.addEventListener('click', e => { e.stopPropagation(); if (O.closeOutside) closeOverlay(); });
    const pane = document.createElement('div');
    pane.className = 'pane';
    const body = document.createElement('div');
    body.className = 'hit'; body.style.cursor = 'default';
    px(body, O);
    body.addEventListener('click', e => e.stopPropagation());
    pane.appendChild(body);
    const img = document.createElement('img');
    img.className = 'layer'; img.alt = ''; img.src = A[O.src]; px(img, O);
    pane.appendChild(img);
    buildChildren(pane, sid, oid, {layers: O.layers, hotspots: O.hotspots, scrolls: O.scrolls});
    scrim.appendChild(pane);
    sec.appendChild(scrim);
    const rr = [O].concat(O.layers || []);
    const box = {minX: Math.min(...rr.map(r => r.x)), minY: Math.min(...rr.map(r => r.y)),
                 maxX: Math.max(...rr.map(r => r.x + r.w)), maxY: Math.max(...rr.map(r => r.y + r.h))};
    overlays[sid + '/' + oid] = {el: scrim, pane, O, body, box};
  }
  for (const [eid, E] of Object.entries(S.effects || {})){
    const img = document.createElement('img');
    img.className = 'effect'; img.alt = ''; img.src = A[E.src]; px(img, E);
    sec.appendChild(img);
    effects[sid + '/' + eid] = {el: img, E, anim: null, timer: null};
  }
  stage.appendChild(sec);
  screens[sid] = {el: sec, S};
}

/* ===== Отрисовка состояния ===== */
function render(){
  for (const {el, L} of layers){
    const vis = !L.visibleWhen || match(L.visibleWhen);
    el.style.display = vis ? 'block' : 'none';
    if (vis){
      const key = tpl(L.src);
      if (el.dataset.key !== key){ el.dataset.key = key; el.src = A[key]; }
      if (L.sizes && L.sizes[key]){ px(el, Object.assign({x: L.x, y: L.y}, L.sizes[key])); }
    }
  }
  for (const {el, h} of hits) el.style.display = (!h.visibleWhen || match(h.visibleWhen)) ? 'block' : 'none';
}

/* ===== Эффекты появления (уведомления, тосты, баннеры) ===== */
function offset(E){
  const gap = 10;
  switch (E.from){
    case 'top': return 'translate(0,' + (-(E.y + E.h + gap)) + 'px)';
    case 'bottom': return 'translate(0,' + (H - E.y + gap) + 'px)';
    case 'left': return 'translate(' + (-(E.x + E.w + gap)) + 'px,0)';
    case 'right': return 'translate(' + (W - E.x + gap) + 'px,0)';
    default: return 'translate(0,0)';
  }
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function stopEffect(key){
  const f = effects[key]; if (!f) return;
  clearTimeout(f.timer); if (f.anim){ f.anim.cancel(); f.anim = null; }
  f.el.classList.remove('show');
}
function playEffect(key){
  const f = effects[key]; if (!f) return;
  const E = f.E;
  if (E.group) for (const [k, g] of Object.entries(effects)) if (k !== key && g.E.group === E.group) stopEffect(k);
  stopEffect(key);
  const enter = E.enterMs || 0, hold = E.holdMs == null ? 1500 : E.holdMs, exitMs = E.exitMs || 0;
  const fade = E.from === 'fade';
  const hidden = fade ? {opacity: 0} : {transform: offset(E)};
  const shown = fade ? {opacity: 1} : {transform: 'translate(0,0)'};
  // два кадра: экран успевает отрисоваться до старта анимации (важно при входе на экран)
  requestAnimationFrame(() => requestAnimationFrame(() => {
    f.el.classList.add('show');
    f.anim = (enter && !reduced) ? f.el.animate([hidden, shown], {duration: enter, easing: E.easing || 'cubic-bezier(.22,.8,.3,1)', fill: 'both'}) : null;
    if (E.holdMs === null || E.persist) return;
    f.timer = setTimeout(() => {
      if (E.exit && E.exit !== 'none' && exitMs && !reduced){
        const out = E.exit === 'fade' ? {opacity: 0} : hidden;
        if (f.anim) f.anim.cancel();
        f.anim = f.el.animate([shown, out], {duration: exitMs, easing: 'ease-in', fill: 'both'});
        f.anim.onfinish = () => stopEffect(key);
      } else stopEffect(key);
    }, enter + hold);
  }));
}

/* ===== Действия ===== */
let current = null, closing = null;
const ovStack = [];   // открытые оверлеи «экран/оверлей»; последний — верхний
const navStack = [], timers = [];   // navStack: [{sid, t}] — откуда пришли и с какой анимацией
const OPPOSITE = {left: 'right', right: 'left', up: 'down', down: 'up'};
function reverseTransition(t){
  if (!t || !t.type || t.type === 'instant' || t.type === 'dissolve') return t;
  const [kind, dir] = t.type.split('-');
  return Object.assign({}, t, {type: kind + '-' + (OPPOSITE[dir] || dir)});
}
function resetVars(list){
  const names = list === true || list === '*' ? Object.keys(SPEC.state || {}) : list;
  for (const k of names) if (SPEC.state[k]) state[k] = SPEC.state[k].initial;
}
/* Смещение оверлея «за край сцены»: все его картинки уходят за границу. dir — направление движения при появлении. */
function ovShift(ov, dir){
  const b = ov.box;
  switch (dir){
    case 'left': return [W - b.minX, 0];
    case 'right': return [-b.maxX, 0];
    case 'up': return [0, H - b.minY];
    case 'down': return [0, -b.maxY];
    default: return [0, H];
  }
}
/* Размещение оверлея по нажатой зоне: O.anchor = {place: left|right|top|bottom, align: top|center|bottom (left|center|right для top/bottom), gap, margin, clamp}.
   Положение считается в момент открытия по фактическому месту зоны на экране (с учётом прокрутки). */
function anchorPlace(ov, ctx){
  const O = ov.O, A = O.anchor;
  ov.pane.style.translate = '';
  if (!A || !ctx || !ctx.el) return;
  const r = ctx.el.getBoundingClientRect(), s = stage.getBoundingClientRect(), pad = (ctx.h && ctx.h.pad) || 0;
  const ax = (r.left - s.left) / SCALE + pad, ay = (r.top - s.top) / SCALE + pad;
  const aw = r.width / SCALE - 2 * pad, ah = r.height / SCALE - 2 * pad;
  const gap = A.gap || 0, margin = A.margin || 0, al = A.align || (A.place === 'top' || A.place === 'bottom' ? 'left' : 'top');
  let x, y;
  if (A.place === 'top' || A.place === 'bottom'){
    y = A.place === 'top' ? ay - gap - O.h : ay + ah + gap;
    x = al === 'right' ? ax + aw - O.w : al === 'center' ? ax + (aw - O.w) / 2 : ax;
  } else {
    x = A.place === 'right' ? ax + aw + gap : ax - gap - O.w;
    y = al === 'bottom' ? ay + ah - O.h : al === 'center' ? ay + (ah - O.h) / 2 : ay;
  }
  if (A.clamp !== false){
    x = Math.min(Math.max(x, margin), W - O.w - margin);
    y = Math.min(Math.max(y, margin), H - O.h - margin);
  }
  ov.pane.style.translate = (x - O.x) + 'px ' + (y - O.y) + 'px';
}
function hideOverlay(key){
  const ov = overlays[key]; if (!ov) return;
  ov.pane.getAnimations().forEach(x => x.cancel()); ov.el.getAnimations().forEach(x => x.cancel());
  ov.el.classList.remove('on'); ov.el.style.zIndex = ''; ov.pane.style.translate = '';
}
/* closeOverlay(): закрывает верхний оверлей (с анимацией ухода O.exit или transition действия close).
   closeOverlay(null, true): мгновенно закрывает все (переход на другой экран, открытие обычного оверлея). */
function closeOverlay(t, all){
  if (all){ closing = null; while (ovStack.length) hideOverlay(ovStack.pop()); return; }
  const key = ovStack[ovStack.length - 1];
  if (!key || closing === key) return;
  const ov = overlays[key], ex = t || ov.O.exit;
  if (!(ex && ex.type && ex.type !== 'instant') || reduced){ ovStack.pop(); hideOverlay(key); return; }
  closing = key;
  const ms = ex.ms || 250, easing = ex.easing || 'ease-in', [kind, dir] = ex.type.split('-');
  let anim;
  if (kind === 'dissolve') anim = ov.pane.animate([{opacity: 1}, {opacity: 0}], {duration: ms, easing, fill: 'both'});
  else {
    const [dx, dy] = ovShift(ov, OPPOSITE[dir] || dir);
    anim = ov.pane.animate([{transform: 'translate(0,0)'}, {transform: `translate(${dx}px,${dy}px)`}], {duration: ms, easing, fill: 'both'});
  }
  if (ov.O.dim) ov.el.animate([{backgroundColor: ov.O.dim}, {backgroundColor: 'rgba(0,0,0,0)'}], {duration: ms, easing, fill: 'both'});
  anim.onfinish = () => {
    if (closing !== key) return;
    closing = null;
    const i = ovStack.lastIndexOf(key); if (i >= 0) ovStack.splice(i, 1);
    hideOverlay(key);
  };
}
/* Переход между экранами. transition: {type, ms, easing}
   type: instant | dissolve | slide-left | slide-right | slide-up | slide-down
         push-left | push-right | push-up | push-down (старый экран уезжает вместе с новым) */
const SHIFT = {left: [W, 0], right: [-W, 0], up: [0, H], down: [0, -H]};
let leaving = null;
function go(sid, fromBack, transition){
  if (!screens[sid]){ console.warn('Нет экрана', sid); return; }
  closeOverlay(null, true);
  for (const k of Object.keys(effects)) stopEffect(k);
  timers.splice(0).forEach(clearTimeout);
  if (leaving){ leaving.getAnimations().forEach(x => x.cancel()); leaving.classList.remove('on', 'anim'); leaving = null; }
  const prev = current ? screens[current].el : null;
  if (current && !fromBack && current !== sid) navStack.push({sid: current, t: transition});
  current = sid; render();
  const next = screens[sid].el;
  const t = transition && transition.type && transition.type !== 'instant' && !reduced ? transition : null;
  if (prev && prev !== next && t){
    const ms = t.ms || 300, easing = t.easing || 'ease-out';
    next.classList.add('on', 'anim');
    const [kind, dir] = t.type.split('-');
    if (kind === 'dissolve'){
      next.animate([{opacity: 0}, {opacity: 1}], {duration: ms, easing});
    } else {
      const [dx, dy] = SHIFT[dir] || [W, 0];
      next.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: 'translate(0,0)'}], {duration: ms, easing});
      if (kind === 'push') prev.animate([{transform: 'translate(0,0)'}, {transform: `translate(${-dx}px,${-dy}px)`}], {duration: ms, easing});
    }
    leaving = prev;
    setTimeout(() => { if (leaving === prev){ prev.classList.remove('on'); prev.getAnimations().forEach(x => x.cancel()); leaving = null; } next.classList.remove('anim'); }, ms);
  } else {
    if (prev) prev.classList.remove('on');
    next.classList.add('on');
  }
  run(screens[sid].S.onEnter || []);
}
function run(actions, ctx){
  for (const a of actions){
    if (a.if){ run(match(a.if) ? (a.then || []) : (a.else || []), ctx); continue; }
    if (a.set){ Object.assign(state, a.set); render(); continue; }
    if (a.add){ for (const [k, d] of Object.entries(a.add)) state[k] = (+state[k] || 0) + d; render(); continue; }
    if (a.go){ if (a.reset) resetVars(a.reset); go(a.go, false, a.transition); continue; }   // go раньше reset: {"go", "reset"} — переход со сбросом
    if (a.reset){ resetVars(a.reset); render(); continue; }
    if (a.back){ const e = navStack.pop(); if (e) go(e.sid, true, a.transition || reverseTransition(e.t)); continue; }
    if (a.open){
      const key = current + '/' + a.open, ov = overlays[key];
      if (!ov){ console.warn('Нет оверлея', key); continue; }
      if (ovStack.includes(key)) continue;
      if (!ov.O.stack) closeOverlay(null, true);       // обычный оверлей заменяет открытый; stack — ложится поверх
      ovStack.push(key); ov.el.style.zIndex = 40 + ovStack.length;
      anchorPlace(ov, ctx);
      ov.el.classList.add('on');
      const t = a.transition || ov.O.transition;
      if (t && t.type && t.type !== 'instant' && !reduced){
        const ms = t.ms || 250, easing = t.easing || 'ease-out', [kind, dir] = t.type.split('-');
        if (ov.O.dim) ov.el.animate([{backgroundColor: 'rgba(0,0,0,0)'}, {backgroundColor: ov.O.dim}], {duration: ms, easing});
        if (kind === 'dissolve') ov.pane.animate([{opacity: 0}, {opacity: 1}], {duration: ms, easing});
        else { const [dx, dy] = ovShift(ov, dir); ov.pane.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: 'translate(0,0)'}], {duration: ms, easing}); }
      }
      continue;
    }
    if (a.close){ closeOverlay(a.transition); continue; }
    if (a.effect){ playEffect(current + '/' + a.effect); continue; }
    if ('after' in a){ const scr = current; timers.push(setTimeout(() => { if (current === scr) run(a.do || [], ctx); }, a.after)); continue; }
  }
}

/* iOS Safari включает :active (эффект нажатия) только при наличии обработчика touchstart */
document.addEventListener('touchstart', () => {}, {passive: true});

/* ===== API для автотеста (scripts/qa_run.py) ===== */
window.__proto = {
  get screen(){ return current; },
  get overlay(){ const k = ovStack[ovStack.length - 1]; return k ? k.split('/').slice(1).join('/') : null; },
  get overlays(){ return ovStack.map(k => k.split('/').slice(1).join('/')); },
  overlayRect(id){ const ov = overlays[current + '/' + id]; if (!ov) return null;
    const r = ov.body.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return {x: (r.left - s.left) / SCALE, y: (r.top - s.top) / SCALE, w: r.width / SCALE, h: r.height / SCALE}; },
  get state(){ const s = Object.assign({}, state); for (const k of Object.keys(SPEC.derived || {})) s[k] = derivedValue(k); return s; },
  effectVisible(id){ const f = effects[current + '/' + id]; return !!f && f.el.classList.contains('show'); },
  effectTop(id){ const f = effects[current + '/' + id]; if (!f) return null; const r = f.el.getBoundingClientRect(), s = stage.getBoundingClientRect(); return (r.top - s.top) / SCALE; },
  toPage(x, y){ const s = stage.getBoundingClientRect(); return {x: s.left + x * SCALE, y: s.top + y * SCALE}; },
  go
};

/* ===== Полноэкранный режим (Android Chrome) ===== */
const fsBox = document.getElementById('fs'), fsMsg = document.getElementById('fsMsg'), root = document.documentElement;
const canFS = SPEC.fullscreenPrompt !== false && !!(root.requestFullscreen || root.webkitRequestFullscreen) && document.fullscreenEnabled !== false && matchMedia('(pointer:coarse)').matches;
const isFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
let skipped = false;
function showFS(){ if (canFS && !isFS() && !skipped) fsBox.classList.add('on'); }
async function enterFS(){
  fsMsg.textContent = '';
  try {
    await (root.requestFullscreen ? root.requestFullscreen({navigationUI: 'hide'}) : root.webkitRequestFullscreen());
    try { await screen.orientation.lock(landscape ? 'landscape' : 'portrait'); } catch (e) {}
    fsBox.classList.remove('on');
  } catch (e) {
    fsMsg.textContent = 'Браузер не разрешил полноэкранный режим на этой странице. Откройте HTML-файл напрямую в Chrome.';
  }
}
document.getElementById('fsGo').addEventListener('click', enterFS);
document.getElementById('fsSkip').addEventListener('click', () => { skipped = true; fsBox.classList.remove('on'); });
document.addEventListener('fullscreenchange', () => { setTimeout(layout, 100); if (!isFS()){ skipped = false; showFS(); } });
document.addEventListener('webkitfullscreenchange', () => setTimeout(layout, 100));

go(SPEC.start);
showFS();
</script>
